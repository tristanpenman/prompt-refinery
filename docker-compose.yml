services:
  app:
    build:
      context: .
    image: prompt-refinery:dev
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      RAILS_LOG_TO_STDOUT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle

volumes:
  bundle:
