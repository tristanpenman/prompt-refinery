services:
  app:
    build:
      context: .
    image: prompt-refinery:dev
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      RAILS_LOG_TO_STDOUT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ollama:/root/.ollama

volumes:
  bundle:
  ollama:
