services:
  app:
    build:
      context: .
    image: prompt-refinery:dev
    # Remove any stale pid left in the bind-mounted tmp/ by an unclean stop
    command: bash -c "rm -f tmp/pids/server.pid && exec ./bin/rails server -b 0.0.0.0"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      RAILS_ALLOWED_HOSTS: ${RAILS_ALLOWED_HOSTS:-}
      RAILS_AUTH_TOKEN: ${RAILS_AUTH_TOKEN:-}
      RAILS_LOG_TO_STDOUT: "1"
      AWS_REGION: ${AWS_REGION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle

  jobs:
    command: bin/jobs
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      RAILS_LOG_TO_STDOUT: "1"
      AWS_REGION: ${AWS_REGION:-}
    image: prompt-refinery:dev
    restart: always
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ollama:/root/.ollama

volumes:
  bundle:
  ollama:
